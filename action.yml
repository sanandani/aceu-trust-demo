name: ACE-U Entra Trust
description: Read-only ACE-U scoring for Microsoft Entra workload identities
inputs:
  input:
    description: Path to a saved Graph JSON export (offline mode)
    required: false
    default: examples/sample-export.json
  format:
    description: json, markdown, or sarif
    required: false
    default: sarif
  output:
    description: Report output path
    required: false
    default: aceu-report.sarif
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install .
    - shell: bash
      run: aceu-entra --input "${{ inputs.input }}" --format "${{ inputs.format }}" --out "${{ inputs.output }}"
