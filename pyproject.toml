[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aceu-entra-trust"
version = "0.1.0"
description = "Read-only ACE-U scoring for Microsoft Entra workload identities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shubham Anandani"}]
urls = {Homepage = "https://imshubh.com"}
dependencies = []

[project.optional-dependencies]
graph = ["azure-identity>=1.15"]
dev = ["pytest>=8"]

[project.scripts]
aceu-entra = "aceu_entra_trust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
